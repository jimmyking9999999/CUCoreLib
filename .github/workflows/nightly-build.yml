name: Nightly Build

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write

env:
  GCS_REFS_OBJECT: gs://cucorelib-game-files/cu-build-refs.zip

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Fork PR notice
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        shell: powershell
        run: |
          Write-Host "Build skipped, as private game refs are unavailable. Thanks for forking and contributing!"

      - uses: google-github-actions/auth@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Download private game refs
        id: refs
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        run: |
          $zipPath = Join-Path $env:RUNNER_TEMP 'cu-game-refs.zip'
          $extractRoot = Join-Path $env:RUNNER_TEMP 'cu-game-refs'

          if (Test-Path $extractRoot)
          {
              Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }

          gcloud storage cp $env:GCS_REFS_OBJECT $zipPath
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot

          $assembly = Get-ChildItem -Path $extractRoot -Recurse -Filter 'Assembly-CSharp.dll' |
              Where-Object { $_.FullName -like '*CasualtiesUnknown_Data\Managed\Assembly-CSharp.dll' } |
              Select-Object -First 1

          if (-not $assembly)
          {
              throw "Could not find CasualtiesUnknown_Data\\Managed\\Assembly-CSharp.dll in extracted refs."
          }

          $managedDir = Split-Path -Parent $assembly.FullName
          $dataDir = Split-Path -Parent $managedDir
          $baseGamePath = Split-Path -Parent $dataDir

          "CUCORELIB_BASE_GAME_PATH=$baseGamePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved CUCORELIB_BASE_GAME_PATH to $baseGamePath"

      - name: Restore
        shell: powershell
        run: |
          nuget restore 'CUCoreLib.sln' -PackagesDirectory packages -NonInteractive -Verbosity detailed

      - name: Build
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        shell: powershell
        run: |
          msbuild 'CUCoreLib.csproj' /t:Build /p:Configuration=Release /p:Platform=AnyCPU /p:BepInExDir=

      - name: Upload build artifacts
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: CUCoreLib-nightly
          path: obj\Release\CUCoreLib.dll
          if-no-files-found: error

      - name: Resolve nightly release tag
        shell: powershell
        run: |
          # This cannot be good practice
          $match = Select-String -Path 'CUCoreLib.cs' -Pattern 'const string VERSION = "([^"]+)"' |
              Select-Object -First 1

          if (-not $match)
          {
              throw "Could not resolve VERSION from CUCoreLib.cs."
          }

          $version = $match.Matches[0].Groups[1].Value

          "NIGHTLY_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NIGHTLY_TAG=v$version-alpha-nightly" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved nightly tag to v$version-alpha-nightly"

      - name: Prepare nightly release description
        shell: powershell
        run: |
          $releaseBodyPath = Join-Path $env:RUNNER_TEMP 'CUCoreLib-nightly-release.md'
          $commitSha = (git show -s --format=%H HEAD | Out-String).Trim()
          $commitShortSha = (git show -s --format=%h HEAD | Out-String).Trim()
          $commitDate = (git show -s --format=%cI HEAD | Out-String).Trim()
          $commitMessage = (git show -s --format=%s HEAD | Out-String).Trim()
          $updatedDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-dd HH:mm:ss UTC')

          @"
          <img width="1440" height="368" alt="cucorelibbannernightly" src="https://github.com/user-attachments/assets/d83e5a13-a531-4728-a242-1bfb308e98e6" />

          ### Automated nightly build from the latest main snapshot!
          This is the latest cutting-edge build of CUCoreLib, and may be unstable.
          It typically updates from the scheduled nightly action. 


          **Last updated:** $updatedDate
          **Source commit:** [$commitShortSha](https://github.com/${{ github.repository }}/commit/$commitSha)
          **Commit message:** $commitMessage

          For the changelogs, please refer to [CHANGELOG.md](https://github.com/jimmyking9999999/CUCoreLib/blob/main/CHANGELOG.md).
          
          Thanks for testing and reporting issues!
          "@ | Set-Content -LiteralPath $releaseBodyPath -Encoding utf8

      - name: Check if nightly version changed
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const newVersion = '${{ env.NIGHTLY_VERSION }}';
            const newTag = '${{ env.NIGHTLY_TAG }}';

            // Find existing nightly release
            const nightlyRelease = releases.find(r =>
              r.tag_name.match(/^v[\d.]+-alpha-nightly$/)
            );

            if (nightlyRelease) {
              // oh no
              const existingVersion = nightlyRelease.tag_name.match(/^v([\d.]+)-alpha-nightly$/)[1];

              if (existingVersion !== newVersion) {
                console.log(`Version changed from ${existingVersion} to ${newVersion}. Deleting old release.`);
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: nightlyRelease.id
                });
                core.setOutput('version_changed', 'true');
              } else {
                core.setOutput('version_changed', 'false');
              }
            } else {
              core.setOutput('version_changed', 'true');
            }

      - name: Publish nightly prerelease
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NIGHTLY_TAG }}
          name: Nightly Build
          prerelease: true
          make_latest: false
          generate_release_notes: false
          body_path: ${{ runner.temp }}\CUCoreLib-nightly-release.md
          files: |
            obj\Release\CUCoreLib.dll
            bin\Release\CUCoreLib.xml

      - name: Remove legacy nightly release assets
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ env.NIGHTLY_TAG }}'
            });

            const keepAssets = ['CUCoreLib.dll', 'CUCoreLib.xml'];

            for (const asset of release.data.assets) {
              if (!keepAssets.includes(asset.name)) {
                await github.rest.repos.deleteReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  asset_id: asset.id
                });
              }
            }

      - name: Refresh nightly release publication timestamp
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: '${{ env.NIGHTLY_TAG }}'
            });

            // GitHub preserves published_at when an existing release is edited.
            // Toggling draft status republishes this rolling prerelease without
            // changing its tag, body, or uploaded assets.
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: true
            });
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false
            });
